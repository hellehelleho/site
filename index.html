<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TapTalk Direct — Приватные диалоги</title>
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="TapTalk 💬 Приватные диалоги онлайн">
  <meta property="og:description" content="Тысячи девушек рядом прямо сейчас. Вход без скачивания приложений.">
  <meta property="og:url" content="https://taptalk.click">
  <meta name="theme-color" content="#07090e">

  <style>
    :root {
      --bg: #07090e;
      --card: rgba(21, 26, 38, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --neon-green: #00ff88;
      --green-glow: rgba(0, 255, 136, 0.5);
      --btn-grad: linear-gradient(135deg, #2563eb, #7c3aed);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #172138 0%, #07090e 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 28px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновые парящие эмодзи */
    .emoji-bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-emoji {
      position: absolute;
      bottom: -40px;
      font-size: 22px;
      opacity: 0.15;
      animation: floatUp 7s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
      15% { opacity: 0.25; }
      85% { opacity: 0.2; }
      100% { transform: translateY(-105vh) rotate(35deg) scale(1.1); opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 2;
    }

    /* Верхний бар */
    .header-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      background: rgba(18, 24, 38, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .brand {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--neon-green);
      font-weight: 700;
      font-size: 13px;
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      background: var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-green);
      animation: pulseDot 1.2s infinite alternate;
    }

    @keyframes pulseDot {
      from { transform: scale(0.85); box-shadow: 0 0 4px var(--neon-green); }
      to { transform: scale(1.3); box-shadow: 0 0 14px var(--neon-green); }
    }

    .online-num {
      display: inline-block;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    .online-flash {
      color: #ffffff !important;
      text-shadow: 0 0 10px var(--neon-green);
      transform: scale(1.08);
    }

    /* Радар */
    .radar-box {
      width: 170px;
      height: 170px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 4px;
    }

    .radar-circle {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0, 255, 136, 0.2);
    }
    .radar-circle:nth-child(1) { width: 55px; height: 55px; }
    .radar-circle:nth-child(2) { width: 110px; height: 110px; border-style: dashed; }
    .radar-circle:nth-child(3) { width: 170px; height: 170px; }

    .radar-sweep {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0, 255, 136, 0.5) 0deg, transparent 75deg, transparent 360deg);
      animation: sweep 2.2s linear infinite;
    }

    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Анимированная пульсация центрального огонька */
    .radar-center-target {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #111827;
      border: 2px solid var(--neon-green);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      font-size: 24px;
      animation: firePulse 1.4s ease-in-out infinite alternate;
    }

    @keyframes firePulse {
      0% {
        transform: scale(0.92);
        box-shadow: 0 0 10px var(--green-glow), inset 0 0 6px var(--green-glow);
      }
      100% {
        transform: scale(1.1);
        box-shadow: 0 0 24px var(--neon-green), inset 0 0 12px var(--neon-green);
      }
    }

    /* Заголовки */
    .hero-text {
      text-align: center;
      padding: 0 8px;
    }

    .hero-text h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Лента карточек */
    .feed {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .chat-card {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      animation: cardSlide 0.35s ease forwards;
    }

    @keyframes cardSlide {
      from { opacity: 0; transform: translateY(-8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1e2538;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .online-badge {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 9px;
      height: 9px;
      background: var(--neon-green);
      border: 2px solid #151a26;
      border-radius: 50%;
      box-shadow: 0 0 6px var(--neon-green);
    }

    .chat-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-name {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-dist {
      font-size: 11.5px;
      color: #64748b;
    }

    .chat-status {
      font-size: 12.5px;
      color: #38bdf8;
      font-weight: 500;
    }

    .connect-btn {
      background: rgba(37, 99, 235, 0.25);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Кнопка */
    .cta-btn {
      width: 100%;
      margin-top: 6px;
      padding: 16px;
      background: var(--btn-grad);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 26px rgba(59, 130, 246, 0.45), 0 0 14px rgba(124, 58, 237, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      animation: pulseBtn 2.2s infinite;
    }

    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 6px 24px rgba(59, 130, 246, 0.4); }
      50% { transform: scale(1.02); box-shadow: 0 8px 30px rgba(59, 130, 246, 0.65), 0 0 20px rgba(124, 58, 237, 0.5); }
      100% { transform: scale(1); box-shadow: 0 6px 24px rgba(59, 130, 246, 0.4); }
    }

    .cta-btn:active {
      transform: scale(0.97);
    }

    .footer-note {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="emoji-bg-container" id="emojiContainer"></div>

  <div class="container">
    <div class="header-bar">
      <div class="brand">💬 TapTalk Direct</div>
      <div class="live-indicator">
        <div class="pulse-dot"></div>
        <span class="online-num" id="onlineCount">1,418</span> онлайн
      </div>
    </div>

    <!-- Радар с пульсирующим огоньком -->
    <div class="radar-box">
      <div class="radar-circle"></div>
      <div class="radar-circle"></div>
      <div class="radar-circle"></div>
      <div class="radar-sweep"></div>
      <div class="radar-center-target">🔥</div>
    </div>

    <div class="hero-text">
      <h1>Тысячи девушек рядом ждут твоего сообщения</h1>
      <p>Анонимный приватный доступ без скачивания приложений и сложной регистрации</p>
    </div>

    <!-- Карточки -->
    <div class="feed" id="chatFeed"></div>

    <button class="cta-btn" id="mainCta">
      <span>Начать общение прямо сейчас</span>
      <span style="font-size: 18px;">👉</span>
    </button>

    <div class="footer-note">
      <span>🔒</span> 100% Конфиденциально • Вход без логина и пароля
    </div>
  </div>

  <script>
    // Твоя закодированная Base64-ссылка на оффер
    const ENCODED_OFFER_URL = "aHR0cHM6Ly9sMHRwaHJoLnNpbXBsZW1lZXR1cC5vcmcvbTh0MmMzdg=="";

    function redirectToOffer() {
      try {
        if (ENCODED_OFFER_URL && !ENCODED_OFFER_URL.includes("СЮДА_ВСТАВИТЬ")) {
          window.location.href = atob(ENCODED_OFFER_URL);
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById("mainCta").addEventListener("click", redirectToOffer);

    // Парящие эмодзи
    const emojis = ["💬", "🔥", "💋", "✨", "💌", "💖", "👀", "🥂"];
    const emojiContainer = document.getElementById("emojiContainer");
    for (let i = 0; i < 12; i++) {
      const el = document.createElement("div");
      el.className = "floating-emoji";
      el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = `${Math.random() * 92}vw`;
      el.style.animationDuration = `${6 + Math.random() * 5}s`;
      el.style.animationDelay = `${Math.random() * 5}s`;
      emojiContainer.appendChild(el);
    }

    // Живой онлайн с постоянным тиком каждые 2.2 секунды
    let onlineVal = 1418;
    const onlineEl = document.getElementById("onlineCount");
    setInterval(() => {
      const delta = Math.floor(Math.random() * 9) - 4; // от -4 до +4
      onlineVal = Math.max(1395, Math.min(1455, onlineVal + delta));
      onlineEl.innerText = onlineVal.toLocaleString('ru-RU');
      onlineEl.classList.add("online-flash");
      setTimeout(() => onlineEl.classList.remove("online-flash"), 350);
    }, 2200);

    // Карточки девушек
    const profiles = [
      { name: "Алина, 22", dist: "450 м от вас", status: "Ожидает ответа...", emoji: "👱‍♀️" },
      { name: "Карина, 21", dist: "890 м от вас", status: "Свободна для диалога", emoji: "👩" },
      { name: "Вика, 20", dist: "1.2 км от вас", status: "Отправила приватное фото", emoji: "👩‍🦰" },
      { name: "Диана, 23", dist: "1.8 км от вас", status: "Онлайн • хочет поболтать", emoji: "👧" },
      { name: "София, 19", dist: "600 м от вас", status: "Ищет компанию на вечер", emoji: "👱‍♀️" },
      { name: "Лера, 22", dist: "2.1 км от вас", status: "Скучает дома 🍷", emoji: "👩" }
    ];

    const feed = document.getElementById("chatFeed");

    function createCard(p) {
      const card = document.createElement("div");
      card.className = "chat-card";
      card.innerHTML = `
        <div class="chat-info">
          <div class="avatar-wrapper">
            <span>${p.emoji}</span>
            <div class="online-badge"></div>
          </div>
          <div class="chat-meta">
            <span class="chat-name">${p.name}</span>
            <span class="chat-dist">📍 ${p.dist}</span>
            <span class="chat-status">${p.status}</span>
          </div>
        </div>
        <button class="connect-btn">Войти</button>
      `;
      card.onclick = redirectToOffer;
      return card;
    }

    // Показываем первые 3 карточки сразу
    profiles.slice(0, 3).forEach(p => feed.appendChild(createCard(p)));

    // Смена карточек каждые 3.5 секунды
    let pIdx = 3;
    setInterval(() => {
      if (pIdx >= profiles.length) pIdx = 0;
      const newCard = createCard(profiles[pIdx]);
      feed.insertBefore(newCard, feed.firstChild);
      if (feed.children.length > 3) {
        feed.removeChild(feed.lastChild);
      }
      pIdx++;
    }, 3500);
  </script>
</body>
</html>
