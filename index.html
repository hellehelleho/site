<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TapTalk — Приватные диалоги онлайн</title>
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="TapTalk 💬 Входящие диалоги рядом">
  <meta property="og:description" content="Более 1,400 девушек онлайн прямо сейчас. Выберите собеседницу без регистрации.">
  <meta property="og:url" content="https://taptalk.click">
  <meta name="theme-color" content="#0d1117">

  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --accent: #2ea043;
      --accent-glow: rgba(46, 160, 67, 0.4);
      --btn-grad: linear-gradient(135deg, #2563eb, #1d4ed8);
      --btn-grad-hover: linear-gradient(135deg, #1d4ed8, #1e40af);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Верхний статус-бар */
    .header-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-glow);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    /* Анимированный интерактивный радар поиска */
    .radar-box {
      width: 160px;
      height: 160px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
    }

    .radar-circle {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(46, 160, 67, 0.25);
    }
    .radar-circle:nth-child(1) { width: 60px; height: 60px; }
    .radar-circle:nth-child(2) { width: 110px; height: 110px; }
    .radar-circle:nth-child(3) { width: 160px; height: 160px; }

    .radar-sweep {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(46, 160, 67, 0.4) 0deg, transparent 60deg, transparent 360deg);
      animation: sweep 2.5s linear infinite;
    }

    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .radar-center-target {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1c2128;
      z-index: 2;
    }

    .radar-center-target img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Заголовки */
    .hero-text {
      text-align: center;
    }

    .hero-text h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .hero-text p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Лента входящих диалогов */
    .feed {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .chat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      animation: slideIn 0.4s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #21262d;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-emoji {
      font-size: 22px;
    }

    .online-badge {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 10px;
      height: 10px;
      background: var(--accent);
      border: 2px solid var(--card-bg);
      border-radius: 50%;
      z-index: 3;
    }

    .chat-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-name {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-dist {
      font-size: 11px;
      color: var(--text-muted);
    }

    .chat-status {
      font-size: 12px;
      color: #7ee787;
      font-weight: 500;
    }

    .connect-btn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* CTA-кнопка */
    .cta-btn {
      width: 100%;
      margin-top: 10px;
      padding: 16px;
      background: var(--btn-grad);
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .cta-btn:active {
      transform: scale(0.98);
      background: var(--btn-grad-hover);
    }

    .footer-note {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div class="brand">💬 TapTalk Direct</div>
      <div class="live-indicator">
        <div class="pulse-dot"></div>
        <span id="onlineCount">1,418</span> онлайн
      </div>
    </div>

    <!-- Радар со встроенным аватаром в фокусе -->
    <div class="radar-box">
      <div class="radar-circle"></div>
      <div class="radar-circle"></div>
      <div class="radar-circle"></div>
      <div class="radar-sweep"></div>
      <div class="radar-center-target" id="radarTarget">
        <!-- Заполняется через JS -->
      </div>
    </div>

    <div class="hero-text">
      <h1>Тысячи девушек рядом ждут твоего сообщения</h1>
      <p>Анонимный приватный доступ без скачивания приложений и сложной регистрации</p>
    </div>

    <div class="feed" id="chatFeed"></div>

    <!-- ЗАМЕНИ ССЫЛКУ ниже на адрес своего оффера -->
    <a href="https://ВАША_ПАРТНЕРСКАЯ_ССЫЛКА_ТУТ" class="cta-btn" id="mainCta">
      <span>Начать общение прямо сейчас</span>
      <span>👉</span>
    </a>

    <div class="footer-note">
      🔒 100% Конфиденциально • Вход без логина и пароля
    </div>
  </div>

  <script>
    /* ========================================================
       ВСТАВЬ СВОЙ BASE64 НИЖЕ ВНУТРЬ КАВЫЧЕК
       (Если строка начинается сразу с 'iVBORw...' или '/9j/...',
       префикс data:image/... добавится автоматически).
       ======================================================== */
    let rawBase64 = "aHR0cHM6Ly9sMHRwaHJoLnNpbXBsZW1lZXR1cC5vcmcvbTh0MmMzdg=="";

    // Автоматическая нормализация префикса Data URI
    let formattedBase64 = "";
    if (rawBase64 && !rawBase64.includes("СЮДА_ВСТАВИТЬ")) {
      if (!rawBase64.startsWith("data:image")) {
        const isPng = rawBase64.startsWith("iVBORw");
        formattedBase64 = `data:image/${isPng ? 'png' : 'jpeg'};base64,` + rawBase64;
      } else {
        formattedBase64 = rawBase64;
      }
    }

    // Установка аватара в центр радара
    const radarTarget = document.getElementById("radarTarget");
    if (formattedBase64) {
      radarTarget.innerHTML = `<img src="${formattedBase64}" alt="Active Target">`;
    } else {
      radarTarget.innerHTML = `<span style="font-size: 24px;">📍</span>`;
    }

    // Пул входящих диалогов
    const profiles = [
      { name: "Алина, 22", dist: "700 м от вас", text: "Ожидает ответа..." },
      { name: "Карина, 21", dist: "1.2 км от вас", text: "Свободна для диалога" },
      { name: "Вика, 20", dist: "2.4 км от вас", text: "Отправила фото" },
      { name: "Диана, 23", dist: "3.1 км от вас", text: "Онлайн" },
      { name: "София, 19", dist: "850 м от вас", text: "Ищет собеседника" },
      { name: "Лера, 22", dist: "1.8 км от вас", text: "Скучает дома" }
    ];

    const feed = document.getElementById("chatFeed");
    const onlineCounter = document.getElementById("onlineCount");

    function renderCard(profile) {
      const card = document.createElement("div");
      card.className = "chat-card";
      
      const avatarContent = formattedBase64 
        ? `<img src="${formattedBase64}" alt="${profile.name}">` 
        : `<span class="avatar-emoji">👱‍♀️</span>`;

      card.innerHTML = `
        <div class="chat-info">
          <div class="avatar-wrapper">
            ${avatarContent}
            <div class="online-badge"></div>
          </div>
          <div class="chat-meta">
            <span class="chat-name">${profile.name}</span>
            <span class="chat-dist">${profile.dist}</span>
            <span class="chat-status">${profile.text}</span>
          </div>
        </div>
        <button class="connect-btn">Войти</button>
      `;

      card.onclick = () => {
        document.getElementById("mainCta").click();
      };
      return card;
    }

    // Инициализация первых 3 карточек
    profiles.slice(0, 3).forEach(p => feed.appendChild(renderCard(p)));

    // Ротация новых диалогов
    let profileIndex = 3;
    setInterval(() => {
      if (profileIndex >= profiles.length) profileIndex = 0;
      
      const newCard = renderCard(profiles[profileIndex]);
      feed.insertBefore(newCard, feed.firstChild);
      
      if (feed.children.length > 3) {
        feed.removeChild(feed.lastChild);
      }
      
      const cur = parseInt(onlineCounter.innerText.replace(',', ''));
      const delta = Math.floor(Math.random() * 5) - 2;
      onlineCounter.innerText = (cur + delta).toLocaleString();

      profileIndex++;
    }, 4500);
  </script>
</body>
</html>
